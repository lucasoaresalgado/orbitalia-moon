# Orbitalia Moon, the whole platform (scope §20). Deploy and update with:
#
#   podman-compose up -d --build --force-recreate      (rootless Podman, the default)
#   docker compose up -d --build                       (Docker: see the overrides below)
#
# (--force-recreate: podman-compose doesn't recreate running containers when
# their image is rebuilt, so without it an update keeps the old code running.)
#
# Then open http://127.0.0.1:3000. The first run prints the login password:
#   podman logs miniasys-setup        (or docker logs miniasys-setup)
#
# Settings come from the environment or the .env next to this file; compose reads
# only the variables named here, and each has a default. Secrets live in
# ${SECRETS_DIR} (generated by the setup service when missing), never in .env.
#
# Docker instead of rootless Podman, in .env:
#   CONTAINER_RUNTIME=docker
#   PODMAN_SOCKET=/var/run/docker.sock
#   APP_UID=1000  APP_GID=1000          # your `id -u` / `id -g`: files stay yours
#   SOCKET_GID=<gid of the docker group> # `getent group docker`
#
# Ollama: the host service on 127.0.0.1:11434, or the container below with
# `--profile ollama` (or COMPOSE_PROFILES=ollama in .env).
#
# web and worker use the host network: everything they talk to (Postgres,
# Ollama, Colibri) is on 127.0.0.1, and nothing is published beyond it. Every
# folder the worker hands to sandboxes is mounted at the same path, because
# sandbox bind mounts resolve on the host.

x-app: &app
  image: localhost/miniasys:dev
  build: { context: ., dockerfile: Containerfile }
  network_mode: host
  restart: unless-stopped
  depends_on:
    setup: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
  # rootless Podman: root in the container is you on the host. Docker: run as you,
  # with the docker group so the worker can reach the socket
  user: "${APP_UID:-0}:${APP_GID:-0}"
  group_add: ["${SOCKET_GID:-0}"]
  # the worker starts sandboxes through the container socket; SELinux would refuse
  # a container access to it, so these two run without a label
  security_opt: [label=disable]
  environment: &env
    HOME: /tmp
    DATABASE_URL: postgres://platform@127.0.0.1:5432/platform
    DATABASE_PASSWORD_FILE: /run/secrets/miniasys/pg_password
    MASTER_KEY_FILE: /run/secrets/miniasys/master_key
    APP_PASSWORD_HASH_FILE: /run/secrets/miniasys/app_password_hash
    ANTHROPIC_API_KEY_FILE: /run/secrets/miniasys/anthropic
    GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/miniasys/github-app.pem
    GITHUB_APP_ID: ${GITHUB_APP_ID:-}
    GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
    NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
    NTFY_TOPIC: ${NTFY_TOPIC:-}
    COLIBRI_URL: ${COLIBRI_URL:-http://127.0.0.1:8000}
    OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    CONTAINER_RUNTIME: ${CONTAINER_RUNTIME:-podman}
    PODMAN_SOCKET: ${PODMAN_SOCKET:-${XDG_RUNTIME_DIR}/podman/podman.sock}
    SANDBOX_IMAGE: localhost/agent-sandbox:dev
    PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3000}
    WORKSPACES_DIR: ${WORKSPACES_DIR:-${HOME}/miniasys/workspaces}
    # each project's code (a git repository), its storage (/storage in script runs) and dependency caches (scope §26)
    PROJECTS_DIR: ${PROJECTS_DIR:-${HOME}/miniasys/projects}
    STORAGE_DIR: ${STORAGE_DIR:-${HOME}/miniasys/storage}
    DEPS_DIR: ${DEPS_DIR:-${HOME}/miniasys/deps}
    SKILLS_DIR: ${SKILLS_DIR:-${HOME}/miniasys/skills}
    LAKEHOUSE_DIR: ${LAKEHOUSE_DIR:-/mnt/data/lakehouse}
    LOG_DIR: ${LOG_DIR:-/mnt/data/miniasys/logs}
    BACKUP_DIR: ${BACKUP_DIR:-/mnt/data/miniasys/backups}
    TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
  volumes:
    - ${SECRETS_DIR:-${HOME}/.config/miniasys/secrets}:/run/secrets/miniasys:ro
    - ${PODMAN_SOCKET:-${XDG_RUNTIME_DIR}/podman/podman.sock}:${PODMAN_SOCKET:-${XDG_RUNTIME_DIR}/podman/podman.sock}
    - ${WORKSPACES_DIR:-${HOME}/miniasys/workspaces}:${WORKSPACES_DIR:-${HOME}/miniasys/workspaces}
    - ${PROJECTS_DIR:-${HOME}/miniasys/projects}:${PROJECTS_DIR:-${HOME}/miniasys/projects}
    - ${STORAGE_DIR:-${HOME}/miniasys/storage}:${STORAGE_DIR:-${HOME}/miniasys/storage}
    - ${DEPS_DIR:-${HOME}/miniasys/deps}:${DEPS_DIR:-${HOME}/miniasys/deps}
    - ${SKILLS_DIR:-${HOME}/miniasys/skills}:${SKILLS_DIR:-${HOME}/miniasys/skills}
    - ${LAKEHOUSE_DIR:-/mnt/data/lakehouse}:${LAKEHOUSE_DIR:-/mnt/data/lakehouse}
    - ${LOG_DIR:-/mnt/data/miniasys/logs}:${LOG_DIR:-/mnt/data/miniasys/logs}
    - ${BACKUP_DIR:-/mnt/data/miniasys/backups}:${BACKUP_DIR:-/mnt/data/miniasys/backups}

services:
  # one-shot, on every `up`: secrets, Postgres's password, local models, folders (scripts/setup.sh)
  setup:
    image: localhost/miniasys:dev
    build: { context: ., dockerfile: Containerfile }
    container_name: miniasys-setup
    network_mode: host
    working_dir: /app/apps/web
    command: ["bash", "/app/scripts/setup.sh"]
    restart: "no"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      # set it to pull the model named in Settings → Models → Local decision model; off by default
      LOCAL_DECISION_MODEL: ${LOCAL_DECISION_MODEL:-}
      # files it creates on mounted folders get this owner (Docker: you, not root)
      OWNER: "${APP_UID:-0}:${APP_GID:-0}"
    volumes:
      - ${SECRETS_DIR:-${HOME}/.config/miniasys/secrets}:/run/secrets/miniasys:Z
      - pgsecret:/run/pgsecret
      - ${PGDATA_DIR:-${HOME}/miniasys/data/pgdata}:/mnt/pgdata
      - ${WORKSPACES_DIR:-${HOME}/miniasys/workspaces}:/mnt/folders/workspaces
      - ${PROJECTS_DIR:-${HOME}/miniasys/projects}:/mnt/folders/projects
      - ${STORAGE_DIR:-${HOME}/miniasys/storage}:/mnt/folders/storage
      - ${DEPS_DIR:-${HOME}/miniasys/deps}:/mnt/folders/deps
      - ${SKILLS_DIR:-${HOME}/miniasys/skills}:/mnt/folders/skills
      - ${LAKEHOUSE_DIR:-/mnt/data/lakehouse}:/mnt/folders/lakehouse
      - ${LOG_DIR:-/mnt/data/miniasys/logs}:/mnt/folders/logs
      - ${BACKUP_DIR:-/mnt/data/miniasys/backups}:/mnt/folders/backups

  postgres:
    image: docker.io/pgvector/pgvector:pg17
    container_name: miniasys-postgres
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      POSTGRES_USER: platform
      POSTGRES_DB: platform
      POSTGRES_PASSWORD_FILE: /run/pgsecret/pg_password
    volumes:
      # on btrfs, `chattr +C` the folder before the first start
      - ${PGDATA_DIR:-${HOME}/miniasys/data/pgdata}:/var/lib/postgresql/data:Z
      - pgsecret:/run/pgsecret:ro
    ports: ["127.0.0.1:5432:5432"]
    deploy: { resources: { limits: { memory: 768m } } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # the worker: queues, agent loop, sandboxes, schedules; runs migrations and seed on start
  worker:
    <<: *app
    container_name: miniasys-worker
    working_dir: /app/apps/worker
    command: ["node", "/app/node_modules/tsx/dist/cli.mjs", "src/main.ts"]
    # leases make a restart safe: runs resume from their last checkpoint
    stop_grace_period: 20s
    deploy: { resources: { limits: { memory: 600m } } }

  # the web app on 127.0.0.1:3000
  web:
    <<: *app
    container_name: miniasys-web
    working_dir: /app/apps/web
    command: ["node", "build/index.js"]
    environment:
      <<: *env
      HOST: 127.0.0.1
      PORT: "3000"
      ORIGIN: http://127.0.0.1:3000
      MINIASYS_ROOT: /app
      # adapter-node waits this long for open SSE streams before closing them
      SHUTDOWN_TIMEOUT: "5"
    deploy: { resources: { limits: { memory: 400m } } }

  # builds the agent sandbox image the worker starts (it exits at once)
  sandbox-image:
    image: localhost/agent-sandbox:dev
    build: { context: sandbox, dockerfile: Containerfile }
    container_name: miniasys-sandbox-image
    command: ["true"]
    restart: "no"

  # only when Ollama isn't installed on the host: --profile ollama
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: miniasys-ollama
    profiles: [ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ${OLLAMA_DIR:-${HOME}/miniasys/data/ollama}:/root/.ollama:Z
    ports: ["127.0.0.1:11434:11434"]
    deploy: { resources: { limits: { memory: 5g } } }
    restart: unless-stopped

volumes:
  pgsecret:
