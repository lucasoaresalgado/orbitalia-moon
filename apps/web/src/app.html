<!doctype html>
<html lang="en" data-theme="orbitalia">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09070f" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <script nonce="%sveltekit.nonce%">
      try { let t = localStorage.getItem("theme"); if (!["orbitalia", "dark", "light"].includes(t)) t = "orbitalia"; document.documentElement.dataset.theme = t; } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
